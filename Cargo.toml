[package]
name = "d_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
polymarket_client_sdk_v2 = { version = "0.8.0", features = ["rtds", "gamma", "clob", "ws"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
turso = "0.8.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
indicatif = "0.18"

[dev-dependencies]
serde_json = "1.0.154"
